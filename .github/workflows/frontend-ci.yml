name: Frontend CI

on:
  push:
    paths:
      - 'HoopFlex/**'
  pull_request:
    paths:
      - 'HoopFlex/**'
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - uses: actions/checkout@v4

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yarn
            HoopFlex/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('HoopFlex/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        working-directory: HoopFlex
        run: |
          yarn install

      - name: Run validation (lint & format check)
        working-directory: HoopFlex
        run: |
          yarn validate
