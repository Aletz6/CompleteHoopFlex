name: Backend CI

on:
  push:
    paths:
      - 'hoopflex-backend/**'
  pull_request:
    paths:
      - 'hoopflex-backend/**'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('hoopflex-backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r hoopflex-backend/requirements.txt

      - name: Run tests
        working-directory: hoopflex-backend
        run: |
          pytest -q
